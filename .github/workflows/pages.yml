# The site is never deployed from committed artifacts: every push runs
# the test suite, then regenerates every case page by running its case,
# then publishes docs/. A red suite or a failed case run blocks deploy.
name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # FEniCSx has no PyPI wheels, so it comes from apt and the job runs
      # on the system python where those packages are importable. The PPA
      # is needed rather than chosen: Ubuntu carries python3-dolfinx in
      # its own archive from 25.04 onward, which is where the dev machine
      # gets it, but ubuntu-latest is still 24.04 and does not.
      #
      # The caching below was added on a misreading and is kept on its
      # merits, which is worth saying plainly. One run showed this
      # install taking 48 minutes and it was read as the dominant cost.
      # It is not. Across seven runs the install is normally under a
      # minute, and that 48 was a single bad day on the PPA mirror. The
      # cache costs seconds and covers those days, so it stays, but it
      # did not buy the improvement it was written for.
      #
      # What the split steps did buy is the real distribution, which is
      # the durable part of that change:
      #
      #     add the PPA                   0.2 min
      #     install FEniCSx               0.9 min
      #     test suite                   16.1 min
      #     regenerate every page        32.0 min
      #
      # So the pages dominate, and run length has tracked them: 29
      # minutes before the 2-RDM and molecule pages existed, 50 after.
      # That is the number to look at if this ever needs to be shorter.
      #
      # The key rolls, so the cache is rewritten every run and picks up a
      # new PPA build the first time one appears.
      - name: Restore the apt download cache
        uses: actions/cache@v6
        with:
          path: ~/apt-debs
          key: apt-fenics-noble-${{ github.run_id }}
          restore-keys: apt-fenics-noble-

      - name: Add the FEniCS PPA
        run: |
          sudo add-apt-repository -y ppa:fenics-packages/fenics
          sudo apt-get update

      - name: Install FEniCSx and the rest of the apt half
        run: |
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99keep-debs
          mkdir -p ~/apt-debs
          sudo cp -n ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get install -y --no-install-recommends \
            python3-dolfinx python3-numpy python3-scipy \
            python3-matplotlib python3-mpmath python3-pytest python3-pip
          sudo cp -u /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
          sudo chown -R "$USER" ~/apt-debs
          echo "cached debs: $(ls ~/apt-debs/*.deb 2>/dev/null | wc -l) files, $(du -sh ~/apt-debs 2>/dev/null | cut -f1)"

      # --no-deps: the solver wheels must NOT drag in a pip numpy, since
      # apt-built petsc4py breaks against it (measured: dtype size 96 vs
      # 88 ABI error). numpy and scipy stay apt's. cvxpy is pinned below
      # 1.7 because newer releases import numpy.lib.array_utils, which
      # exists only in numpy >= 2, and apt numpy is 1.26.
      - name: Install the solver wheels
        run: pip install --break-system-packages --no-deps 'cvxpy-base<1.7' scs qdldl

      - name: Run the test suite
        run: python3 -m pytest test_sufficit.py -q

      - name: Regenerate every case page from a fresh run
        run: python3 docs/make_cases.py

      # The whole of docs/ is uploaded, so anything left lying in it gets
      # published. That is the generator itself, its bytecode cache, and
      # whatever pytest dropped there. None of it is the site: the source
      # is already on GitHub and nothing on the site links to it.
      - name: Keep the build tooling out of the published site
        run: |
          rm -rf docs/__pycache__ docs/.pytest_cache docs/make_cases.py
          echo "publishing:"; find docs -type f | sort

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
