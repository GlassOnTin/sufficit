# The site is never deployed from committed artifacts: every push runs
# the test suite, then regenerates every case page by running its case,
# then publishes docs/. A red suite or a failed case run blocks deploy.
name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # FEniCSx has no PyPI wheels; install the same Debian-family
      # packages the dev machine uses, via the FEniCS PPA, and run on
      # the system python so apt packages are importable
      - run: |
          sudo add-apt-repository -y ppa:fenics-packages/fenics
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-dolfinx python3-numpy python3-scipy \
            python3-matplotlib python3-mpmath python3-pytest python3-pip
      # --no-deps: the solver wheels must NOT drag in a pip numpy —
      # apt-built petsc4py breaks against it (measured: dtype size 96
      # vs 88 ABI error). numpy and scipy stay apt's.
      - run: pip install --break-system-packages --no-deps cvxpy-base scs
      - run: python3 -m pytest test_sufficit.py -q
      - run: python3 docs/make_cases.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
